global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 12h
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        chat_id: 123456789
        # message_thread_id: 12345  # Optional: Telegram topic/thread ID
        send_resolved: true
        parse_mode: 'HTML'
        message: |
          {{ range .Alerts -}}
          {{ if eq .Status "firing" -}}
          {{ if eq .Labels.category "quota" }}🚨 <b>OPENCODE QUOTA ALERT</b>
          <pre>Provider : {{ .Labels.provider }}
          Window   : {{ .Labels.window }} ({{ .Labels.usage_step }} used)
          Host     : {{ .Labels.instance }}
          Quota    : {{ if .Annotations.progress_bar }}{{ .Annotations.progress_bar }}{{ else }}{{ .Annotations.description }}{{ end }}</pre>
          {{ else if eq .Labels.category "device-online" }}💻 <b>DEVICE ONLINE</b>
          <pre>Device : {{ .Labels.instance }} ({{ .Labels.os }})
          IP     : {{ .Labels.tailscale_ip }}
          Role   : {{ .Labels.role }}
          Status : Active on Tailnet (> 2m)</pre>
          {{ else if eq .Labels.category "availability" }}🔥 <b>SERVER OFFLINE</b>
          <pre>Server : {{ .Labels.instance }} ({{ .Labels.os }})
          IP     : {{ .Labels.tailscale_ip }}
          Alert  : {{ .Labels.alertname }} ({{ .Labels.severity }})
          Impact : {{ .Annotations.description }}</pre>
          {{ else if eq .Labels.category "storage" }}⚠️ <b>STORAGE ALERT</b>
          <pre>Host    : {{ .Labels.instance }}
          Alert   : {{ .Labels.alertname }} ({{ .Labels.severity }})
          Details : {{ .Annotations.description }}</pre>
          {{ else if eq .Labels.category "hardware" }}🌡️ <b>HARDWARE ALERT</b>
          <pre>Host    : {{ .Labels.instance }}
          Alert   : {{ .Labels.alertname }} ({{ .Labels.severity }})
          Details : {{ .Annotations.description }}</pre>
          {{ else if eq .Labels.category "ai-gateway" }}🤖 <b>AI GATEWAY ALERT</b>
          <pre>Host    : {{ .Labels.instance }}
          Alert   : {{ .Labels.alertname }} ({{ .Labels.severity }})
          Details : {{ .Annotations.description }}</pre>
          {{ else }}🚨 <b>SYSTEM ALERT</b>
          <pre>Target  : {{ .Labels.instance }}
          Alert   : {{ .Labels.alertname }} ({{ .Labels.severity }})
          Details : {{ .Annotations.description }}</pre>
          {{ end }}
          {{- else -}}
          {{ if eq .Labels.category "device-online" }}💤 <b>DEVICE DISCONNECTED</b>
          <pre>Device : {{ .Labels.instance }} ({{ .Labels.os }})
          Status : Offline / Sleeping</pre>
          {{ else }}✅ <b>ALERT RESOLVED</b>
          <pre>Alert  : {{ .Labels.alertname }}
          Target : {{ .Labels.instance }}
          Status : Normal / Healthy</pre>
          {{ end }}
          {{- end }}
          {{ end }}
